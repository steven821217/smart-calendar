# Gateway（MCP-10 / 8.8）：TLS 終結 + rate-limit + 反向代理。
# mcp/api service 不直接對公網，一律經此 gateway。對外只開 gateway 的 443（+80 轉址）。
#
# 路由：
#   /mcp*        → mcp:3001   （MCP Streamable HTTP；SSE 需關 buffering + 長 timeout）
#   /v1* /health → api:3000
#   /            → web:4173   （前端）

# rate-limit 區：依來源 IP。mcp/api 較嚴，靜態較鬆。
limit_req_zone $binary_remote_addr zone=mcp_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

upstream mcp_upstream  { server mcp:3001; }
upstream api_upstream  { server api:3000; }
upstream web_upstream  { server web:4173; }

# 80 → 443 轉址
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自簽憑證（entrypoint 於容器啟動時產生；正式改掛真憑證/Let's Encrypt）
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全標頭
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 5m;

    # --- MCP（Streamable HTTP，含 SSE 串流）---
    location /mcp {
        limit_req zone=mcp_zone burst=40 nodelay;
        proxy_pass http://mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Authorization 標頭原樣轉發（MCP-7：per-request Bearer）
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        # SSE：關閉 buffering、拉長 timeout，允許長連線串流
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- SSE 即時推播（精確匹配，優先於 /v1 前綴）---
    # EventSource 走 query token；SSE 需關 buffering + 長 timeout 才能即時串流。
    location = /v1/events/stream {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- OAuth 自動發現 metadata ---
    # 必須與 /mcp 同源且匿名可讀（RFC 9728 / RFC 8414）。預設 location / 會導到前端
    # SPA 並回 index.html，client 會解析失敗，故明確導到 api。
    location /.well-known/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # --- REST API ---
    location /v1 {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://api_upstream;
        # 站內 agent（/v1/agent/chat）會打本機 LLM，複雜問題可能耗時數十秒。
        # nginx 預設 proxy_read_timeout 僅 60s，慢請求會被切成 504；此處放寬為 300s。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }

    location /health {
        proxy_pass http://api_upstream/health;
    }

    # --- 前端 ---
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
