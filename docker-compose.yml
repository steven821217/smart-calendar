name: smart-calendar

# 完整本機部署：`docker compose up --build` 一鍵啟動所有服務。
# 對外只暴露 gateway（80/443）；其餘服務僅在 compose 內網互通（MCP-10：mcp/api 不直接對公網）。

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app_user:${DB_PASSWORD:-change-me-appuser}@db:5432/${DB_NAME:-calendar}
  ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres}@db:5432/${DB_NAME:-calendar}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OPA_URL: http://opa:8181
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  JWT_SECRET: ${JWT_SECRET:-change-me-32bytes-minimum-secret-value}
  PGTZ: UTC
  # 委員會 LLM（無金鑰時委員會走 fail-closed；設 MCP_STUB_MODEL=1 可本機 stub 驗證）
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  # 容器內連 host 上的 ollama：預設 host.docker.internal（需搭配各服務的 extra_hosts）。
  # 走雲端 OpenAI 則把 .env 的 LLM_BASE_URL 留空即可。
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  RESOURCE_HANDOVER_BUFFER_MINUTES: "15"
  RESOURCE_VEHICLE_TYPES: equipment
  VEHICLE_REMINDER_LEAD_MINUTES: "30"
  OAUTH_CODE_TTL_SEC: "300"
  OAUTH_TOKEN_TTL_SEC: "3600"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${DB_NAME:-calendar}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose: ["5432"]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose: ["6379"]

  opa:
    image: openpolicyagent/opa:latest-static
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    expose: ["8181"]

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025" # 本機收信 UI
    expose: ["1025"]

  # run-once：建表 + RLS + app_user，再 seed 示範資料
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["sh", "-c", "pnpm exec tsx src/db/migrate.ts && pnpm exec tsx src/db/seed.ts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    environment:
      <<: *app-env
      PORT: "3000"
      HOST: 0.0.0.0 # 容器內全介面，供 gateway 反代；對外仍只經 gateway
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux：讓容器解析 host 上的 ollama
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      opa: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/reminders/worker.ts"]
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s

  mcp:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/mcp/http.ts"]
    environment:
      <<: *app-env
      MCP_HTTP_HOST: 0.0.0.0 # 容器內綁全介面；對外仍只經 gateway
      MCP_HTTP_PORT: "3001"
      MCP_STUB_MODEL: ${MCP_STUB_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux：委員會連 host 上的 ollama
    expose: ["3001"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      opa: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: "" # 相對路徑，與 gateway 同源
    expose: ["4173"]
    depends_on:
      api: { condition: service_started }

  # Gateway：唯一對外入口（TLS + rate-limit 反代）。mcp/api/web 皆在其後。
  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-localhost}
    ports:
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9443:443"
    volumes:
      - gatewaycerts:/etc/nginx/certs
    depends_on:
      api: { condition: service_started }
      mcp: { condition: service_started }
      web: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  gatewaycerts:
