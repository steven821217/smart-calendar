name: smart-calendar

# 完整本機部署：`docker compose up --build` 一鍵啟動所有服務。
# 對外只暴露 gateway（80/443）；其餘服務僅在 compose 內網互通（MCP-10：mcp/api 不直接對公網）。

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app_user:${DB_PASSWORD:-change-me-appuser}@db:5432/${DB_NAME:-calendar}
  ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres}@db:5432/${DB_NAME:-calendar}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OPA_URL: http://opa:8181
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  JWT_SECRET: ${JWT_SECRET:-change-me-32bytes-minimum-secret-value}
  PGTZ: UTC
  # 登入（3.1）：seed 設定示範帳號密碼；登入失敗節流上限/視窗
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password-1234}
  LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-8}
  LOGIN_FAIL_WINDOW_SEC: ${LOGIN_FAIL_WINDOW_SEC:-900}
  # 自助註冊（建立新 workspace）：可關閉；per-IP 上限防濫用
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-1}
  REGISTER_MAX_PER_IP: ${REGISTER_MAX_PER_IP:-5}
  REGISTER_WINDOW_SEC: ${REGISTER_WINDOW_SEC:-3600}
  # 委員會 LLM：預設走 compose 內建的 ollama service（見下方 ollama / ollama-pull）。
  # OPENAI_API_KEY 需為「非空」否則委員會 fail-closed 不呼叫；本機 ollama 填佔位值 local 即可。
  # 要改走雲端 OpenAI：於 .env 設真實 OPENAI_API_KEY 並把 LLM_BASE_URL 留空。
  OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
  LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
  # 預設指向 compose 內 ollama service（容器間用 service 名互連，不依賴 host）。
  # 若要連 host 上既有的 ollama，於 .env 設 LLM_BASE_URL=http://host.docker.internal:11434/v1。
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  # Query-conditioned ICL（訓練-free 提升小模型分類）：示例數 0=關閉；embedding 模型須在同一端點。
  INAPP_ICL_K: ${INAPP_ICL_K:-4}
  INAPP_SPECULATE: "${INAPP_SPECULATE:-1}"
  INAPP_EMBED_MODEL: ${INAPP_EMBED_MODEL:-embeddinggemma:latest}
  INAPP_EMBED_TIMEOUT_MS: ${INAPP_EMBED_TIMEOUT_MS:-1500}
  RESOURCE_HANDOVER_BUFFER_MINUTES: "15"
  RESOURCE_VEHICLE_TYPES: equipment
  VEHICLE_REMINDER_LEAD_MINUTES: "30"
  OAUTH_CODE_TTL_SEC: "300"
  # PoC：不做 refresh token，改用長效 access token（預設 30 天）+ 即時撤銷。
  OAUTH_TOKEN_TTL_SEC: ${OAUTH_TOKEN_TTL_SEC:-2592000}
  # OAuth 自動發現：對外基底 URL 與 redirect_uri 白名單
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  OAUTH_REDIRECT_ALLOWLIST: ${OAUTH_REDIRECT_ALLOWLIST:-}

services:
  # 本機 LLM：ollama（GPU）。api/mcp/worker 的委員會與站內 agent 預設連此。
  # 走 nvidia runtime（比 --gpus 的 DeviceRequests 穩：後者在 daemon-reload 後會掉 cgroup 規則
  # 導致靜默 fallback 到 CPU）。model 存於 named volume，拉過一次即快取、重啟免再下載。
  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 多人並發時讓多請求並行（預設序列會排隊）；視 VRAM 調整。
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-3}
      # 模型常駐不卸載：避免卸載後重新載入時觸發 CUDA error 800（driver 取不到 device context），
      # 那會讓 ollama 靜默 fallback 到 CPU（14B 單題從 ~5s 暴增到數十秒）。-1=永不卸載。
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # Flash Attention + q8 KV cache：省 VRAM、加速長 context（本機 LLM 推論最佳化）。
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ollama:/root/.ollama
    expose: ["11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # run-once：首次啟動自動下載所需 model（委員會/agent 的 qwen3:14b 與 ICL 的 embeddinggemma）。
  # model 已在 volume 內則 pull 立即返回（冪等）。拉完即退出。
  ollama-pull:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[ollama-pull] pulling ${LLM_MODEL:-qwen3:14b} ..."
        ollama pull "${LLM_MODEL:-qwen3:14b}"
        echo "[ollama-pull] pulling ${INAPP_EMBED_MODEL:-embeddinggemma:latest} ..."
        ollama pull "${INAPP_EMBED_MODEL:-embeddinggemma:latest}"
        echo "[ollama-pull] done."
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${DB_NAME:-calendar}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  opa:
    image: openpolicyagent/opa:latest-static
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025" # 本機收信 UI
    expose: ["1025"]

  # run-once：建表 + RLS + app_user，再 seed 示範資料
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["sh", "-c", "pnpm exec tsx src/db/migrate.ts && pnpm exec tsx src/db/seed.ts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    environment:
      <<: *app-env
      PORT: "3000"
      HOST: 0.0.0.0 # 容器內全介面，供 gateway 反代；對外仍只經 gateway
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux：讓容器解析 host 上的 ollama
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      opa: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/reminders/worker.ts"]
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }
    stop_grace_period: 30s

  mcp:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "exec", "tsx", "src/mcp/http.ts"]
    environment:
      <<: *app-env
      MCP_HTTP_HOST: 0.0.0.0 # 容器內綁全介面；對外仍只經 gateway
      MCP_HTTP_PORT: "3001"
      # DNS rebinding 防護：瀏覽器帶 Origin 時的允許清單（逗號分隔）。
      # 未設定時只允許 localhost；非瀏覽器 client 不帶 Origin，不受影響。
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_STUB_MODEL: ${MCP_STUB_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux：委員會連 host 上的 ollama
    expose: ["3001"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      opa: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: "" # 相對路徑，與 gateway 同源
    expose: ["4173"]
    depends_on:
      api: { condition: service_started }

  # Gateway：唯一對外入口（TLS + rate-limit 反代）。mcp/api/web 皆在其後。
  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-localhost}
      # 自簽憑證要額外納入的位址（逗號分隔）。對方用哪個位址連，那個位址就必須在 SAN 裡。
      GATEWAY_SAN_IPS: ${GATEWAY_SAN_IPS:-}
      GATEWAY_SAN_DNS: ${GATEWAY_SAN_DNS:-}
    ports:
      # 預設只綁 loopback（安全預設）。要讓同一內網的其他機器連線，
      # 在 .env 設 GATEWAY_BIND=0.0.0.0（或指定某張網卡的 IP，範圍更小）。
      - "${GATEWAY_BIND:-127.0.0.1}:9080:80"
      - "${GATEWAY_BIND:-127.0.0.1}:9443:443"
    volumes:
      - gatewaycerts:/etc/nginx/certs
    depends_on:
      api: { condition: service_started }
      mcp: { condition: service_started }
      web: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  gatewaycerts:
  ollama:
